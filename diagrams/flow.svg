<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1440" viewBox="0 0 900 1440" role="img" aria-labelledby="title desc">
<title id="title">Mini CRM – pagrindinė veiksmų seka</title>
<desc id="desc">Pradedama nuo įmonių sąrašo. Pridedama įmonė, įvedami rekvizitai, pasirinktinai pridedami kontaktai. Galima pridėti daugiau kontaktų. Paruošti duomenys pateikiami konsolėje.</desc>
